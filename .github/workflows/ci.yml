# CI tối thiểu theo spine: lint + dependency-cruiser (AD-2) + test + build image.
# Chạy được ở GitHub Actions hoặc bất cứ runner nào có Docker; bản chạy tay: ops/ci-local.sh
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Lint (kèm luật AD-15 no-restricted-imports/syntax)
        run: npm run lint
        working-directory: api
      - name: Ranh giới module acyclic (AD-2)
        run: npm run depcruise
        working-directory: api
      - name: Test đơn vị
        run: npm test
        working-directory: api
      - name: Build
        run: npm run build
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: Cấm hex màu ngoài tokens.css (AD-15)
        run: |
          rogue=$(grep -rlE "#[0-9a-fA-F]{3,8}\b" src --include="*.css" | grep -v "css/tokens.css" || true)
          if [ -n "$rogue" ]; then
            echo "Có hex màu ngoài tokens.css:"; echo "$rogue"; exit 1
          fi
        working-directory: web
      - name: Test đơn vị
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    # `IMS_BASE_URL` phải KHỚP `APP_BASE_URL` mà stack được dựng bên dưới: Playwright dùng nó
    # làm baseURL, và `tests/helpers.ts` dùng nó làm `Origin` cho mọi request thủ công.
    # Thiếu biến này thì Playwright rơi về `https://ims.pmh.com.vn` — host không tồn tại trong
    # runner — và CsrfGuard trả 403 ORIGIN_MISMATCH cho mọi request ghi. Đó là lý do job này
    # chưa từng xanh được (F-QA-01).
    env:
      IMS_BASE_URL: https://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sinh secret + cert cho môi trường test
        run: |
          mkdir -p secrets ops/certs
          echo "1=$(openssl rand -hex 32)" > secrets/master_key
          openssl rand -hex 32 > secrets/password_pepper
          : > secrets/smtp_password
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout ops/certs/privkey.pem -out ops/certs/fullchain.pem \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
          cp .env.example .env
          sed -i 's|^APP_BASE_URL=.*|APP_BASE_URL=https://localhost|' .env
      - name: Dựng stack (kèm override e2e)
        run: docker compose -f docker-compose.yml -f docker-compose.override.e2e.yml --profile dev up -d --build
      - name: Chờ api sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if docker compose ps api | grep -q healthy; then exit 0; fi
            sleep 5
          done
          docker compose logs api; exit 1
      - name: Seed tài khoản
        run: docker compose exec -T api node scripts/seed-sa.mjs
        env:
          ALLOW_E2E_RESET: '1'
      - name: E2E Playwright (desktop + 390px)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
