# CI theo spine, CHIA HAI NƠI (quyết định 03/09):
#
#   GitHub Actions (file này) — thứ chạy nhanh và không cần stack thật:
#     lint · dependency-cruiser (AD-2) · test đơn vị · build.
#     Đây là cổng chặn merge vào master (branch protection).
#
#   Máy nội bộ (`bash ops/ci-local.sh --e2e`) — E2E Playwright trên docker compose thật.
#     E2E cần dựng cả stack (postgres + redis + api + worker + web) rồi chạy 260 bài trên
#     trình duyệt thật; ở runner GitHub việc đó tốn 10-15 phút mỗi lần và ăn hết hạn mức
#     Actions của repo private. Ở đây stack đã chạy sẵn nên nhanh hơn nhiều.
#
# ĐÁNH ĐỔI PHẢI BIẾT: E2E không còn là cổng TỰ ĐỘNG. Nó chỉ chặn được nếu người ta thật sự
# chạy. Ràng buộc duy nhất giữ nó sống là luật đóng epic trong CLAUDE.md — chạy
# `bash ops/ci-local.sh --e2e` xanh TRƯỚC khi chuyển story sang `done`. Nếu về sau thấy nếp
# này trôi, cách rẻ nhất để đóng lại là dựng một self-hosted runner trong LAN
# (Settings → Actions → Runners) và bật lại job `e2e` bên dưới.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Lint (kèm luật AD-15 no-restricted-imports/syntax)
        run: npm run lint
        working-directory: api
      - name: Ranh giới module acyclic (AD-2)
        run: npm run depcruise
        working-directory: api
      - name: Test đơn vị
        run: npm test
        working-directory: api
      - name: Build
        run: npm run build
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 07/09: web dùng ESLint (không còn oxlint) để cả repo một phương ngữ luật, và `lint`
      # gọi luôn dependency-cruiser — thứ web chưa từng có trước đó.
      - name: Lint + ranh giới tầng (AD-15)
        run: npm run lint
        working-directory: web
      # 19/09: bản `grep` thô từng nằm ở đây đã bị gỡ. Nó không bỏ chú thích trước khi soi, nên
      # nó ĐỎ trên ba file mà lỗi duy nhất là có chú thích ghi lại mã màu đo được — trong khi
      # cổng nội bộ (đã sửa 18/09) xanh sạch trên đúng ba file ấy. Hai bản luật cho một khái
      # niệm thì bản nào cũng có ngày nói khác bản kia; giờ cả hai gọi chung một file.
      - name: Cấm hex màu ngoài tokens.css (AD-15)
        run: bash ops/gate-hex.sh
      - name: Cấm file lẫn kiểu xuống dòng
        run: bash ops/gate-eol.sh
      - name: Test đơn vị
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  # E2E KHÔNG chạy ở đây (xem ghi chú đầu file), nhưng CỔNG KIỂU của nó thì chạy được — nó chỉ
  # cần `tsc`, không cần stack. Trước 07/09 thư mục `e2e/` không có tsconfig và không nằm trong
  # cổng nào; đó là cơ chế đã để lọt lỗi `__dirname` trong gói ESM hôm 03/09 (globalSetup chết,
  # KHÔNG bài nào chạy, lệnh vẫn thoát 0).
  e2e-typecheck:
    name: e2e — kiểm kiểu + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Kiểm kiểu bộ E2E (tsc --noEmit)
        run: npm run typecheck
        working-directory: e2e
      # LINT BỘ E2E CŨNG CHẠY Ở ĐÂY (§18 #5, thêm 22/09).
      #
      # Trước đó job này chỉ có `tsc --noEmit`, nên lint của `e2e/` KHÔNG có cổng chặn merge —
      # nó chỉ sống trong `ops/ci-local.sh`, thứ duy nhất ép nó là người chạy tay. Ba luật
      # đang nằm sau nó: cấm `sleep`, cấm ghim trần selector CSS, và AD-16 (định danh tiếng
      # Việt). Bảng §16.8 của sổ rà soát xếp "e2e lint" cạnh hai dòng web/api vốn LÀ cổng
      # GitHub, nên đọc lướt sẽ tưởng cả ba đều chặn merge — nay thì đúng là cả ba.
      #
      # `--max-warnings=0` nằm sẵn trong `e2e/package.json`, nên mức `warn` của
      # `no-restricted-syntax` vẫn làm job này ĐỎ. Mức ấy để phân biệt hai nhóm luật khi đọc
      # log, không phải để nới.
      - name: Lint bộ E2E
        run: npm run lint
        working-directory: e2e

  # ===================================================================================
  # E2E chạy ở MÁY NỘI BỘ, không ở đây — xem ghi chú đầu file.
  #
  #   bash ops/ci-local.sh --e2e
  #
  # Cấu hình bên dưới giữ nguyên, đã sửa đúng (biến `IMS_BASE_URL` phải KHỚP `APP_BASE_URL`
  # mà stack được dựng — thiếu nó thì Playwright trỏ vào host không tồn tại và CsrfGuard trả
  # 403 ORIGIN_MISMATCH cho mọi request ghi; đó là lý do job này chưa từng xanh, F-QA-01).
  # Muốn bật lại: bỏ dấu `#` và gắn một self-hosted runner có Docker.
  #
  # e2e:
  #   runs-on: [self-hosted, linux, docker]
  #   needs: [api, web]
  #   env:
  #     IMS_BASE_URL: https://localhost
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #     - name: Sinh secret + cert cho môi trường test
  #       run: |
  #         mkdir -p secrets ops/certs
  #         echo "1=$(openssl rand -hex 32)" > secrets/master_key
  #         openssl rand -hex 32 > secrets/password_pepper
  #         : > secrets/smtp_password
  #         openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
  #           -keyout ops/certs/privkey.pem -out ops/certs/fullchain.pem \
  #           -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
  #         cp .env.example .env
  #         sed -i 's|^APP_BASE_URL=.*|APP_BASE_URL=https://localhost|' .env
