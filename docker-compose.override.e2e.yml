# Override CHỈ dùng cho môi trường test E2E: mount script dọn dữ liệu test vào container
# (script này cố tình KHÔNG nằm trong image production — xem api/Dockerfile).
#
#   docker compose -f docker-compose.yml -f docker-compose.override.e2e.yml up -d
#
services:
  postgres:
    # Mở cổng Postgres RA HOST — chỉ ở file override này, chỉ trên loopback.
    #
    # `docker-compose.yml` cố ý KHÔNG publish (NFR-04 zero-trust, `web` là cổng vào duy nhất),
    # và điều đó không đổi: file này không bao giờ đi cùng production.
    #
    # Vì sao cần: tầng test chạm DB thật (`api/test/*.spec.ts`, 08/09) chạy bằng jest TRÊN HOST,
    # không chạy được trong container — ảnh api build với `npm ci --omit=dev` nên không có jest.
    # Cổng lẻ 55432 để không đụng Postgres cài sẵn trên máy ai đó ở 5432.
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432'
  redis:
    # Cùng lý do với postgres: `outbox-relay-redis.spec.ts` chứng minh BullMQ thật sự khử job
    # đúp theo `jobId` — thứ mà một Queue giả chỉ khẳng định được về hình dạng tham số.
    ports:
      - '127.0.0.1:${REDIS_TEST_PORT:-56379}:6379'
  mailpit:
    # Cổng SMTP 1025 ra host. Cổng 8025 (API đọc hộp thư) đã publish sẵn ở compose gốc cho
    # Playwright; thiếu 1025 thì không gửi thư từ host vào được, và `MailTransportService` —
    # nơi DUY NHẤT chạm nodemailer — không có bài kiểm nào chạm hộp thư thật.
    ports:
      - '127.0.0.1:${SMTP_TEST_PORT:-51025}:1025'
  api:
    volumes:
      # 07/09: gộp 11 hàm dọn của `helpers.ts` về MỘT script, một kết nối pg, một transaction
      # mỗi vùng. Trước đó mỗi hàm tự `docker compose exec` một lệnh riêng (0,46s/lần, ~900
      # lượt mỗi lần chạy đầy đủ = ~7 phút thuần overhead).
      - ./api/scripts/reset-e2e.mjs:/app/scripts/reset-e2e.mjs:ro
    environment:
      ALLOW_E2E_RESET: '1'
      # DSN chủ sở hữu cho RIÊNG script dọn E2E (cần tháo trigger append-only). Chỉ có trong file
      # override này, không bao giờ đi cùng production — api ở prod không cầm DSN chủ sở hữu (OPS-07).
      E2E_RESET_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ims}
