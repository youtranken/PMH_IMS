# Header bảo mật cho phần SPA (OPS-04). Include ở TỪNG location phục vụ file tĩnh: nginx không
# kế thừa add_header của cấp trên vào location có add_header riêng. Location /api KHÔNG include
# file này — helmet phía api đã gắn header cho response JSON.
add_header Strict-Transport-Security 'max-age=31536000' always;
add_header X-Frame-Options           'DENY' always;
add_header X-Content-Type-Options    'nosniff' always;
add_header Referrer-Policy           'strict-origin-when-cross-origin' always;
add_header Permissions-Policy        'geolocation=(), camera=(), microphone=()' always;
# style 'unsafe-inline': component React dùng thuộc tính style. Script thì không có inline nào.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
