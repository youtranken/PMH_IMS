# IMS web — SPA + reverse proxy /api → api:3000.
# NFR-04: TLS terminate TẠI ĐÂY (nơi duy nhất giữ cert wildcard *.pmh.com.vn).
# LAN-only, cổng 443; cổng 80 chỉ để chuyển hướng.

server {
  listen 80;
  server_name ims.pmh.com.vn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ims.pmh.com.vn;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  add_header Strict-Transport-Security 'max-age=31536000' always;
  add_header X-Frame-Options        'DENY' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy        'strict-origin-when-cross-origin' always;
  add_header Permissions-Policy     'geolocation=(), camera=(), microphone=()' always;

  # DNS nội bộ Docker + re-resolve: api recreate đổi IP không làm nginx 502 vĩnh viễn.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Asset build có hash trong tên → cache dài. index.html thì không bao giờ cache.
  location /static/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-store';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api đúng chuỗi (không slash) — vẫn về backend, không rơi vào SPA fallback trả HTML.
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    # Trần upload: 20MB file đính kèm + overhead multipart.
    client_max_body_size 21m;
  }

  location = /health {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    access_log off;
  }
}
