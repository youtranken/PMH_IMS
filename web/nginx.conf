# IMS web — SPA + reverse proxy /api → api:3000.
# NFR-04: TLS terminate TẠI ĐÂY (nơi duy nhất giữ cert wildcard *.pmh.com.vn).
# LAN-only, cổng 443; cổng 80 chỉ để chuyển hướng.

server {
  listen 80;
  server_name ims.pmh.com.vn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ims.pmh.com.vn;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  # Mozilla "intermediate": chỉ bộ mã có forward secrecy + AEAD cho TLS 1.2.
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # DNS nội bộ Docker + re-resolve: api recreate đổi IP không làm nginx 502 vĩnh viễn.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Asset build có hash trong tên → cache dài. index.html thì không bao giờ cache.
  location /static/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
    include /etc/nginx/security-headers.conf;
  }

  location = /index.html {
    add_header Cache-Control 'no-store';
    include /etc/nginx/security-headers.conf;
  }

  # Header bảo mật chỉ gắn cho phần SPA; response của /api đã có header của helmet, gắn thêm
  # ở đây là thành hai bộ header lệch nhau.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
  }

  # /api đúng chuỗi (không slash) — vẫn về backend, không rơi vào SPA fallback trả HTML.
  location = /api {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    proxy_read_timeout 60s;
  }

  # Import Excel (thiết bị, danh mục): một transaction cho cả file, file 20.000 dòng ghi mất vài chục
  # giây. 60s của các route khác thì người dùng nhận 504 trong khi transaction vẫn commit, rồi bấm lại.
  location ~ ^/api/v1/[a-z-]+/import/(?:preview|commit)$ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    proxy_read_timeout 300s;
    client_max_body_size 26m;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    proxy_read_timeout 60s;
    # Trần CỨNG của upload: 25 MB (`FILE_HARD_CAP_MB` bên API) + 1 MB phần bọc multipart. Trần
    # từng file đổi được ở `file.max_size_mb`; muốn nâng quá 25 MB thì phải nâng cả ở đây lẫn
    # `FILE_HARD_CAP_MB`, vì request lớn hơn bị cắt ngay ở cửa này trước khi tới API.
    client_max_body_size 26m;
  }

  # draw.io tự host (AD-17): tệp tĩnh chép vào image lúc build (`web/Dockerfile`, stage
  # `drawio-src`), phát thẳng từ đĩa. Không Tomcat, không servlet: `/drawio/proxy`, `/export`,
  # `/log`… không tồn tại nên rơi vào 404 ở dưới.
  #
  # Chỉ GET/HEAD tệp có đuôi biết trước. Trang HTML duy nhất được phát là `index.html` (trình vẽ):
  # các trang khác trong thư mục draw.io (`open.html`, `dropbox.html`…) là lối vào dịch vụ đám mây.
  # `service-worker.js`/`workbox-*` bị gỡ lúc build và chặn thêm ở đây: một service worker đăng ký
  # được dưới /drawio/ sẽ chặn hộ mọi request của đường đó.
  location = /drawio {
    return 301 /drawio/;
  }

  location ^~ /drawio/ {
    root /usr/share/nginx;
    index index.html;
    autoindex off;

    location ~ ^/drawio/(?:.*/)?(?:service-worker|workbox-)|/(?:WEB-INF|META-INF)/ {
      return 404;
    }

    location ~ ^/drawio/(?:index\.html)?$ {
      limit_except GET HEAD {
        deny all;
      }
      # index.html đổi theo phiên bản nhưng không mang hash trong tên: không cache dài.
      add_header Cache-Control 'no-cache' always;
      include /etc/nginx/drawio-headers.conf;
    }

    location ~ ^/drawio/(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+\.(?:js|css|txt|xml|json|png|gif|jpg|svg|ico|ttf|woff2?)$ {
      limit_except GET HEAD {
        deny all;
      }
      expires 1h;
      include /etc/nginx/drawio-headers.conf;
    }

    return 404;
  }

  location = /health {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    include /etc/nginx/proxy-api-headers.conf;
    access_log off;
  }
}
