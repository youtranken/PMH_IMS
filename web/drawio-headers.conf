# Header cho tệp tĩnh của draw.io dưới /drawio/ — KHÁC bộ của SPA (`security-headers.conf`).
#
# Khung draw.io chạy với nguồn gốc MỜ: CSP `sandbox` không có `allow-same-origin` (cùng thẻ
# `<iframe sandbox>` của `web/src/ui/drawio-frame`). Vì vậy mã draw.io — và mọi thứ một bản vẽ độc
# cố nhét vào nó — không đọc được cookie, localStorage hay DOM của IMS, không gọi được /api bằng
# phiên người dùng. Hai bên chỉ nói chuyện qua postMessage, và SPA kiểm `event.source` từng tin.
# CSP `sandbox` ở đây giữ hộp cát cả khi ai đó mở thẳng URL /drawio/ ngoài iframe.
#
# Chỉ `allow-scripts`, không `allow-downloads`/`allow-modals`/`allow-popups` (AD-17): xuất file đi
# qua lệnh `export` của cầu nối rồi qua server; hộp thoại của draw.io là DOM của chính nó, không cần
# alert/confirm của trình duyệt.
#
# Hệ quả của nguồn gốc mờ: draw.io tải tệp ngôn ngữ/hình bằng XHR là request khác nguồn, nên cần
# `Access-Control-Allow-Origin: *`. An toàn vì đây toàn là tệp công khai của draw.io, phát từ đĩa,
# không đọc cookie.
#
# `frame-ancestors 'self'` + `X-Frame-Options SAMEORIGIN`: chỉ trang IMS được nhúng draw.io.
# `connect-src 'self'`, không host ngoài: trình vẽ chạy offline, không gọi ra Internet.
# `style-src 'unsafe-inline'`: index.html và trình vẽ dùng style nội tuyến. Script thì không có
# script nội tuyến nào nên không cần `'unsafe-inline'` cho script.
add_header X-Frame-Options           'SAMEORIGIN' always;
add_header X-Content-Type-Options    'nosniff' always;
add_header Referrer-Policy           'no-referrer' always;
add_header Access-Control-Allow-Origin '*' always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data:; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; sandbox allow-scripts" always;
