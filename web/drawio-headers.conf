# Header cho tệp tĩnh của draw.io dưới /drawio/ — KHÁC bộ của SPA (`security-headers.conf`).
#
# Khung draw.io chạy với nguồn gốc MỜ: CSP `sandbox` không có `allow-same-origin` (cùng thẻ
# `<iframe sandbox>` bên SPA). Vì vậy mã draw.io — và mọi thứ một bản vẽ độc cố nhét vào nó — không
# đọc được cookie, localStorage hay DOM của IMS, không gọi được /api bằng phiên người dùng. Hai bên
# chỉ nói chuyện qua postMessage, và SPA kiểm `event.source` từng tin.
#
# Hệ quả của nguồn gốc mờ: draw.io tải tệp ngôn ngữ/hình bằng XHR là request khác nguồn, nên cần
# `Access-Control-Allow-Origin: *`. An toàn vì đây toàn là tệp công khai của draw.io, không kèm
# cookie (nginx còn xoá Cookie trước khi chuyển tiếp).
#
# `frame-ancestors 'self'` + `X-Frame-Options SAMEORIGIN`: chỉ trang IMS được nhúng draw.io.
# `script-src 'unsafe-inline'`: index.html của draw.io có script nội tuyến; chấp nhận được vì nó
# chạy trong hộp cát ở trên. `connect-src 'self'`: không gọi ra Internet (chạy offline).
add_header X-Frame-Options           'SAMEORIGIN' always;
add_header X-Content-Type-Options    'nosniff' always;
add_header Referrer-Policy           'no-referrer' always;
add_header Access-Control-Allow-Origin '*' always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data:; frame-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; sandbox allow-scripts allow-downloads allow-modals" always;
