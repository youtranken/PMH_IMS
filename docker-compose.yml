# IMS — 5 service (AD-12): pg, redis, api, worker, web. Dev thêm mailpit.
# postgres/redis KHÔNG publish cổng ra host (NFR-04 zero-trust); `web` là cổng vào duy nhất.
# Bí mật (master key, pepper, SMTP pass) đi qua docker secret dạng FILE, không env (AD-11).

# ─────────────────────────────────────────────────────────────────────────────
# Môi trường DÙNG CHUNG của api và worker — CỐ Ý không chứa DSN của chủ sở hữu DB.
#
# DSN chủ sở hữu (quyền ALTER/DROP, tháo được trigger append-only của audit_log) chỉ nằm trong
# service `migrate`, chạy một lần rồi thoát (OPS-07). Thứ gì đọc được môi trường của api hay
# worker (lỗi RCE, bản dump lúc sập, `docker inspect`) cũng không có quyền đó.
# ─────────────────────────────────────────────────────────────────────────────
# Log json-file mặc định không giới hạn dung lượng: pino ghi JSON ra stdout sẽ làm đầy đĩa (OPS-06).
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

# Không cho tiến trình trong container tự nâng quyền (setuid) — OPS-10.
x-hardening: &hardening
  security_opt: ['no-new-privileges:true']

# api/worker/migrate chạy node không cần quyền đặc biệt nào: bỏ hết capability, rootfs chỉ đọc
# (chỗ ghi duy nhất là /tmp và volume file đính kèm).
x-node-hardening: &node_hardening
  security_opt: ['no-new-privileges:true']
  cap_drop: ['ALL']
  read_only: true
  tmpfs: ['/tmp']

x-app-env: &app_env
  NODE_ENV: ${NODE_ENV:-production}
  # D-01: ứng dụng chạy bằng role HẸP (`ims_app`), migration chạy bằng CHỦ SỞ HỮU.
  # Trước 20/09 cả hai là một, và role đó là superuser — nên câu REVOKE giữ sổ nhật ký
  # chỉ-thêm (NFR-03) không có hiệu lực nào. Xem `0048_app_role_split.sql`.
  #
  # Tên role viết THẲNG, không qua biến (§18 #7): `0048` tạo role bằng đúng chuỗi `ims_app` ở
  # chín câu lệnh, và migration đã chạy thì không sửa được. Một biến `APP_DB_USER` đổi được
  # chỉ là cái núm không nối dây — đặt khác đi cho ra một `.env` hợp lệ, một role chưa từng
  # được tạo, và một API không boot.
  DATABASE_URL: postgresql://ims_app:${APP_DB_PASSWORD:?bắt buộc — mật khẩu role ứng dụng, xem 0048}@postgres:5432/${POSTGRES_DB:-ims}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  APP_BASE_URL: ${APP_BASE_URL:?bắt buộc — dùng để kiểm Origin chống CSRF}
  MASTER_KEY_FILE: /run/secrets/ims_master_key
  PASSWORD_PEPPER_FILE: /run/secrets/ims_password_pepper
  # Bắt buộc khai (OPS-01): rơi về mailpit ở prod là mọi thư đi vào hư không mà không ai biết.
  # Dev đặt SMTP_HOST=mailpit, SMTP_PORT=1025 trong .env.
  SMTP_HOST: ${SMTP_HOST:?bắt buộc — prod là smtp.gmail.com, dev là mailpit}
  SMTP_PORT: ${SMTP_PORT:?bắt buộc — prod 587, dev 1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD_FILE: /run/secrets/ims_smtp_password
  FILE_STORAGE_DIR: /data/files
  TZ: Asia/Ho_Chi_Minh

services:
  postgres:
    # Ghim bản vá (OPS-09): `17-alpine` trôi theo từng lần pull, hai máy build khác ngày ra hai bản.
    image: postgres:17.10-alpine
    restart: unless-stopped
    <<: *hardening
    logging: *logging
    mem_limit: 1g
    shm_size: 256m
    # DB-05: ~1/4 RAM của container cho cache, log câu chậm để tìm chỗ cần index.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?bắt buộc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bắt buộc}
      POSTGRES_DB: ${POSTGRES_DB:-ims}
      TZ: Asia/Ho_Chi_Minh
      # DB-03: mật khẩu role chủ sở hữu `ims_owner`. Chỉ `ops/db/initdb-owner.sh` đọc nó —
      # lúc initdb trên cụm mới, hoặc qua `ops/db-owner-bootstrap.sh` trên cụm đã có.
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?bắt buộc — mật khẩu role chủ sở hữu ims_owner (DB-03)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DB-03: superuser chỉ còn dùng để dựng `ims_owner` và giao database cho nó. Image chạy
      # file trong initdb.d đúng một lần, lúc thư mục dữ liệu còn trống.
      - ./ops/db:/ims-db:ro
      - ./ops/db/initdb-owner.sh:/docker-entrypoint-initdb.d/10-ims-owner.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    <<: *hardening
    logging: *logging
    mem_limit: 320m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?bắt buộc}
    # Mật khẩu đi qua file cấu hình tạm chứ không qua tham số dòng lệnh (không hiện trong `ps`).
    # noeviction: BullMQ mất job nếu Redis đuổi key khi đầy; maxmemory thấp hơn mem_limit để Redis
    # báo lỗi ghi thay vì bị OOM-kill. AOF everysec: Redis khởi động lại không mất job (OPS-08).
    command:
      - sh
      - -c
      - >-
        echo "requirepass $$REDIS_PASSWORD" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  # Chạy MỘT lần mỗi lần `up`: dựng role ims_app + áp migration bằng chủ sở hữu, rồi thoát (OPS-07).
  # DSN chủ sở hữu CHỈ nằm ở đây — api và worker không bao giờ cầm nó.
  # Chủ sở hữu là `ims_owner`, KHÔNG phải POSTGRES_USER (DB-03): superuser bỏ qua mọi ACL và
  # mọi kiểm tra, nên một migration lỗi hay một DSN bị lộ từ đây là toàn quyền trên cả cụm.
  # Tên role viết thẳng, cùng lý do với `ims_app`: `ops/db/initdb-owner.sh` tạo đúng tên này.
  migrate:
    image: ims-api:latest
    build: ./api
    restart: 'no'
    <<: *node_hardening
    user: '1000:1000'
    logging: *logging
    mem_limit: 256m
    command: ['node', 'dist/ops/migrate.main.js']
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: Asia/Ho_Chi_Minh
      MIGRATION_DATABASE_URL: postgresql://ims_owner:${MIGRATION_DB_PASSWORD:?bắt buộc — xem DB-03}@postgres:5432/${POSTGRES_DB:-ims}
      DATABASE_URL: postgresql://ims_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ims}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ims-api:latest
    restart: unless-stopped
    <<: *node_hardening
    user: '1000:1000'
    logging: *logging
    mem_limit: 768m
    stop_grace_period: 30s
    environment: *app_env
    secrets: &api_secrets
      - ims_master_key
      - ims_password_pepper
      - ims_smtp_password
    volumes:
      - filesdata:/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ims-api:latest
    restart: unless-stopped
    <<: *node_hardening
    user: '1000:1000'
    logging: *logging
    mem_limit: 512m
    # Đủ cho lượt relay đang chạy và thư đang gửi kết thúc (worker chờ tối đa 20 giây).
    stop_grace_period: 30s
    command: ['node', 'dist/worker/worker.js']
    # Worker ghi heartbeat sau mỗi lượt relay thành công có hỏi Redis (OPS-03).
    healthcheck:
      test: ['CMD', 'node', '-e', "process.exit(Date.now()-require('fs').statSync('/tmp/worker-heartbeat').mtimeMs<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment: *app_env
    secrets: *api_secrets
    volumes:
      - filesdata:/data/files
    depends_on:
      api: { condition: service_healthy }

  web:
    image: ims-web:latest
    build: ./web
    restart: unless-stopped
    <<: *hardening
    logging: *logging
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', '--no-check-certificate', 'https://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
    # Cổng HOST đọc từ biến, mặc định giữ nguyên 443/80 cho production.
    #
    # Máy dev thường đã có một reverse proxy khác giữ cổng 80 (ở máy PMH là edge nginx của
    # dự án bên cạnh), và khi đó `docker compose up` chết với "port is already allocated" —
    # kéo theo `ops/ci-local.sh --e2e` không chạy được, tức DoD gạch 7 bị chặn vì một lý do
    # chẳng liên quan gì tới sản phẩm. Đặt `WEB_HTTP_PORT=8080` trong `.env` là xong.
    #
    # Cổng 80 bên TRONG container chỉ làm 301 sang HTTPS (`web/nginx.conf:6-8`), nên đổi cổng
    # host không ảnh hưởng gì tới bộ E2E — nó chạy hoàn toàn trên HTTPS.
    ports:
      - '${WEB_HTTPS_PORT:-443}:443'
      - '${WEB_HTTP_PORT:-80}:80'
    volumes:
      # Cert wildcard *.pmh.com.vn — chỉ service này giữ (NFR-04, TLS terminate tại web).
      - ${TLS_CERT_DIR:-./ops/certs}:/etc/nginx/certs:ro
    depends_on:
      api: { condition: service_healthy }

  # Dev only: hộp thư giả. Prod dùng SMTP thật (SMTP_HOST/.env) và không bật service này.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *logging
    profiles: ['dev']
    ports:
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      TZ: Asia/Ho_Chi_Minh

secrets:
  ims_master_key:
    file: ./secrets/master_key
  ims_password_pepper:
    file: ./secrets/password_pepper
  ims_smtp_password:
    file: ./secrets/smtp_password

volumes:
  pgdata:
  redisdata:
  filesdata:
